<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sudoer Of Myself | beta</title>
  </head>
  <body>
    <div id="app">
      <div class="terminal-shell">
        <div id="xterm-container"></div>
        <div class="terminal-tools">
          <button
            id="immersive-mode-button"
            class="terminal-tool-button immersive-mode-button"
            type="button"
            aria-label="Enter fullscreen"
            aria-pressed="false"
            hidden
          >
            <svg class="immersive-mode-button__icon immersive-mode-button__enter" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5" />
            </svg>
            <svg class="immersive-mode-button__icon immersive-mode-button__exit" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 9h6V3M21 9h-6V3M3 15h6v6M21 15h-6v6" />
            </svg>
          </button>
          <button
            id="terminal-size-button"
            class="terminal-tool-button"
            type="button"
            aria-label="Fit to window"
            aria-pressed="false"
            hidden
          >
            <svg class="immersive-mode-button__icon terminal-size-button__custom" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 3h18v18H3zM11 17l6-6M15 17l2-2" />
            </svg>
            <svg class="immersive-mode-button__icon terminal-size-button__fit" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 3h18v18H3zM7 7h4M7 7v4M17 17h-4M17 17v-4M7 7l10 10" />
            </svg>
          </button>
        </div>
        <output id="terminal-size-feedback" class="terminal-size-feedback" hidden></output>
        <button
          id="terminal-resize-handle"
          class="terminal-resize-handle"
          type="button"
          tabindex="-1"
          aria-label="Resize terminal"
          title="Drag to resize"
          hidden
        >
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 20l12-12M14 20l6-6" /></svg>
        </button>
      </div>
    </div>
    <script type="module" src="./src/index.ts"></script>
  </body>
</html>
